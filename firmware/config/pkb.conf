# Enable I2C and PCF8574 GPIO expander
CONFIG_I2C=y
CONFIG_GPIO_PCF8574=y
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Enable external power control (VLED MOSFET switch on P1.13 / D8)
CONFIG_ZMK_EXT_POWER=y

# Enable SK6812MINI RGB Underglow (DLED on P0.02 / D0)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Enable OLED Display (J4 on I2C SCL=P1.14/D9, SDA=P1.15/D10)
# Optimized for 128x32 OLED: show numeric battery %, layer, and USB/BT output, no WPM clutter
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Automatically turn off OLED after 30s of inactivity (wakes on any key press)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
