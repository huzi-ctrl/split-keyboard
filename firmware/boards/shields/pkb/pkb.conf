# Enable I2C and PCF8574 GPIO expander
CONFIG_I2C=y
CONFIG_GPIO_PCF8574=y
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Enable external power control (VLED MOSFET switch on P1.13 / D8)
CONFIG_ZMK_EXT_POWER=y

# Enable SK6812MINI RGB Underglow (DLED on P0.02 / D0)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Enable OLED Display (J4 on I2C SCL=P1.14/D9, SDA=P1.15/D10)
CONFIG_ZMK_DISPLAY=y
